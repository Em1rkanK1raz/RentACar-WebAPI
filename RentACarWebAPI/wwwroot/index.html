<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Rent A Car Yönetim Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h1 class="mb-4">🚗 Rent A Car Yönetim Paneli</h1>

        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Araç Listesi</h5>
            </div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Marka</th>
                            <th>Model</th>
                            <th>Plaka</th>
                            <th>Günlük Ücret</th>
                            <th>Durum</th>
                        </tr>
                    </thead>
                    <tbody id="carTable">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
    fetch('/api/Cars')
        .then(response => response.json())
        .then(cars => {
            const table = document.getElementById('carTable');
            cars.forEach(car => {
                table.innerHTML += `
                    <tr>
                        <td>${car.id}</td>
                        <td>${car.brand}</td>
                        <td>${car.model}</td>
                        <td>${car.plate}</td>
                        <td>${car.dailyPrice} ₺</td>
                        <td>${car.isRented ? '🔴 Kirada' : '🟢 Müsait'}</td>
                    </tr>`;
            });
        });
    </script>

</body>
</html>
